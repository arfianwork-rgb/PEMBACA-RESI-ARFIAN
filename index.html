<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Resi Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/tesseract.js@v4.1.1/dist/tesseract.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Plus Jakarta Sans', sans-serif; } 
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-animate {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between m-0 p-0 overflow-x-hidden pb-20">

    <!-- Header & Dashboard Utama -->
    <div id="main-dashboard" class="w-full max-w-md mx-auto p-4 space-y-4 flex-1 flex flex-col">
        <!-- Header Atas ala Android App Bar -->
        <div class="bg-slate-900/90 backdrop-blur-md px-4 py-3.5 rounded-2xl border border-slate-800 flex justify-between items-center shadow-lg">
            <div>
                <h1 class="text-sm font-bold text-white tracking-tight">Database Resi Web</h1>
                <p id="db-status" class="text-[11px] text-amber-400 mt-0.5">Menghubungkan Google Sheets...</p>
            </div>
            <div class="flex items-center gap-1.5 bg-slate-950/60 px-2.5 py-1 rounded-full border border-slate-800">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-[10px] font-semibold text-slate-300">Online</span>
            </div>
        </div>

        <!-- Panel Total Valid & Tidak Valid di Tengah -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-900/90 backdrop-blur-md p-4 rounded-2xl border border-emerald-500/30 text-center shadow-lg">
                <span class="block text-3xl font-extrabold text-emerald-400 tracking-tight" id="count-valid">0</span>
                <span class="text-[10px] uppercase tracking-wider text-emerald-400/80 font-bold mt-1 block">✔ Total Valid</span>
            </div>
            <div class="bg-slate-900/90 backdrop-blur-md p-4 rounded-2xl border border-rose-500/30 text-center shadow-lg">
                <span class="block text-3xl font-extrabold text-rose-400 tracking-tight" id="count-invalid">0</span>
                <span class="text-[10px] uppercase tracking-wider text-rose-400/80 font-bold mt-1 block">✖ Tidak Valid</span>
            </div>
        </div>

        <!-- Bagian Bawah: Daftar Riwayat Resi yang Sudah Disken -->
        <div class="bg-slate-900/80 backdrop-blur-md p-4 rounded-3xl border border-slate-800 flex-1 flex flex-col shadow-lg">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Riwayat Resi Terpindai</h3>
                <label class="text-xs text-blue-400 hover:text-blue-300 font-semibold underline cursor-pointer">
                    Unggah Galeri
                    <input type="file" id="file-upload" accept="image/*" class="hidden">
                </label>
            </div>
            
            <!-- Dua Tombol Salin Terpisah -->
            <div class="grid grid-cols-2 gap-2 mb-3">
                <button id="btn-copy-valid" class="bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/40 text-emerald-400 text-[11px] font-semibold py-2 px-2 rounded-xl transition shadow-sm flex items-center justify-center gap-1">
                    <span>📋</span> Salin Valid
                </button>
                <button id="btn-copy-invalid" class="bg-rose-600/20 hover:bg-rose-600/30 border border-rose-500/40 text-rose-400 text-[11px] font-semibold py-2 px-2 rounded-xl transition shadow-sm flex items-center justify-center gap-1">
                    <span>📋</span> Salin Tidak Valid
                </button>
            </div>

            <ul id="result-list" class="space-y-2 bg-slate-950/60 p-3 rounded-2xl flex-1 min-h-[180px] max-h-72 overflow-y-auto border border-slate-800/80">
                <li class="text-center text-slate-500 text-xs py-10">Belum ada resi yang dipindai hari ini</li>
            </ul>
        </div>
    </div>

    <!-- Tombol Kamera Mengambang (Floating Action Button / FAB ala Android) -->
    <div class="fixed bottom-5 right-5 z-40">
        <button id="btn-start-camera" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 px-5 rounded-full shadow-2xl shadow-blue-600/50 active:scale-95 transition flex items-center gap-2.5 border border-blue-400/30 backdrop-blur-md">
            <span class="text-lg">📷</span>
            <span class="text-xs font-bold tracking-wide uppercase">Buka Kamera</span>
        </button>
    </div>

    <!-- Area Utama Kamera Full Screen (Tersembunyi secara default) -->
    <main id="camera-wrapper" class="hidden fixed inset-0 z-50 bg-black flex flex-col justify-between">
        <div class="relative w-full flex-1 bg-black overflow-hidden">
            <video id="video" class="w-full h-full object-cover" autoplay playsinline></video>
            <!-- Target Garis Pemindai -->
            <div class="absolute inset-0 border-2 border-emerald-400 border-dashed opacity-60 m-10 rounded-3xl pointer-events-none animate-pulse"></div>
        </div>
        <canvas id="canvas" class="hidden"></canvas>

        <!-- Panel Informasi Bagian Bawah Saat Kamera Aktif -->
        <footer class="w-full bg-slate-900/95 backdrop-blur-md p-4 border-t border-slate-800 space-y-3">
            <div class="bg-slate-950/80 border border-slate-800 p-3 rounded-2xl flex items-center justify-between">
                <div class="overflow-hidden pr-2">
                    <span class="text-[10px] uppercase font-semibold text-slate-400 block">Resi Terakhir:</span>
                    <span id="last-scanned-number" class="text-sm font-mono font-bold text-slate-200 tracking-wide">-</span>
                </div>
                <div id="last-scanned-badge">
                    <span class="text-[10px] bg-slate-800 text-slate-400 px-3 py-1 rounded-xl font-medium">Belum ada scan</span>
                </div>
            </div>

            <div class="flex gap-2">
                <button id="btn-scan" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg shadow-emerald-600/25 active:scale-95 transition text-sm flex items-center justify-center gap-2">
                    <span>🔍</span> AMBIL / SCAN RESI
                </button>
                <button id="btn-stop-camera" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-3.5 px-5 rounded-2xl text-xs transition">
                    Tutup
                </button>
            </div>
        </footer>
    </main>

    <!-- Custom Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 left-0 right-0 z-50 flex justify-center px-4 pointer-events-none"></div>

    <script>
        const FIXED_SHEETS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSEDsXuDSQyUoOSHH9_S_em73jCM2iYIlbBo9_A_B8EzHoLye9_TuYJqld9pcehq6iWb8qHQrRVjj4o/pub?output=csv";

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const resultList = document.getElementById('result-list');
        const toastContainer = document.getElementById('toast-container');
        
        const countValidSpan = document.getElementById('count-valid');
        const countInvalidSpan = document.getElementById('count-invalid');
        
        const mainDashboard = document.getElementById('main-dashboard');
        const cameraWrapper = document.getElementById('camera-wrapper');
        
        const btnStart = document.getElementById('btn-start-camera');
        const btnScan = document.getElementById('btn-scan');
        const btnStop = document.getElementById('btn-stop-camera');
        const fileUpload = document.getElementById('file-upload');
        
        const btnCopyValid = document.getElementById('btn-copy-valid');
        const btnCopyInvalid = document.getElementById('btn-copy-invalid');
        
        const dbStatus = document.getElementById('db-status');
        const lastScannedNumber = document.getElementById('last-scanned-number');
        const lastScannedBadge = document.getElementById('last-scanned-badge');

        let stream = null;
        let scannedNumbers = new Set();
        let validCount = 0;
        let invalidCount = 0;
        let masterDatabase = new Set();
        const orderRegex = /58[67]\d{15}/g; 

        function showToast(message, type = 'info') {
            toastContainer.innerHTML = '';
            
            const toast = document.createElement('div');
            toast.className = `toast-animate pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl shadow-2xl border text-xs font-semibold backdrop-blur-xl transition-all max-w-sm w-full`;
            
            if(type === 'success') {
                toast.className += ` bg-emerald-950/90 border-emerald-500/50 text-emerald-200`;
                toast.innerHTML = `<span class="text-base">✨</span> <span>${message}</span>`;
            } else if(type === 'error') {
                toast.className += ` bg-rose-950/90 border-rose-500/50 text-rose-200`;
                toast.innerHTML = `<span class="text-base">⚠️</span> <span>${message}</span>`;
            } else {
                toast.className += ` bg-slate-900/90 border-slate-700 text-slate-200`;
                toast.innerHTML = `<span class="text-base">📌</span> <span>${message}</span>`;
            }
            
            toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function autoSyncDatabase() {
            try {
                const response = await fetch(FIXED_SHEETS_URL);
                const csvText = await response.text();
                
                masterDatabase.clear();
                const lines = csvText.split(/\r?\n/);

                lines.forEach(line => {
                    const cols = line.split(',');
                    cols.forEach(col => {
                        const cleanVal = col.replace(/["']/g, "").trim();
                        const matches = cleanVal.match(orderRegex);
                        if (matches) {
                            matches.forEach(m => masterDatabase.add(m));
                        } else if (cleanVal.length >= 10) {
                            masterDatabase.add(cleanVal);
                        }
                    });
                });

                if(masterDatabase.size > 0) {
                    dbStatus.innerText = `Terhubung (${masterDatabase.size} resi aktif)`;
                    dbStatus.className = "text-[11px] text-emerald-400 mt-0.5";
                } else {
                    dbStatus.innerText = "Database kosong";
                    dbStatus.className = "text-[11px] text-amber-400 mt-0.5";
                }
            } catch (err) {
                dbStatus.innerText = "Gagal memuat database online";
                dbStatus.className = "text-[11px] text-rose-400 mt-0.5";
            }
        }

        window.addEventListener('DOMContentLoaded', autoSyncDatabase);

        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            if(type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, ctx.currentTime);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, ctx.currentTime);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.5);
            }
        }

        btnStart.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
                
                mainDashboard.classList.add('hidden');
                btnStart.parentElement.classList.add('hidden'); // Sembunyikan FAB saat kamera aktif
                cameraWrapper.classList.remove('hidden');
            } catch (err) {
                showToast("Gagal membuka kamera: " + err.message, "error");
            }
        });

        btnStop.addEventListener('click', () => {
            if (stream) stream.getTracks().forEach(track => track.stop());
            cameraWrapper.classList.add('hidden');
            mainDashboard.classList.remove('hidden');
            btnStart.parentElement.classList.remove('hidden'); // Munculkan kembali FAB
        });

        async function processImage(imageSource) {
            lastScannedNumber.innerText = "Memproses...";
            lastScannedBadge.innerHTML = `<span class="text-[10px] bg-amber-500/20 text-amber-400 px-3 py-1 rounded-xl font-medium animate-pulse">⏳ Membaca OCR...</span>`;
            
            try {
                const result = await Tesseract.recognize(imageSource, 'eng');
                const text = result.data.text.replace(/\s+/g, ''); 
                const matches = text.match(orderRegex);
                
                if (matches && matches.length > 0) {
                    let num = matches[0]; 
                    
                    let isInDb = true;
                    if (masterDatabase.size > 0) {
                        isInDb = masterDatabase.has(num);
                    }

                    if (!scannedNumbers.has(num)) {
                        scannedNumbers.add(num);
                        if (isInDb) {
                            validCount++;
                            countValidSpan.innerText = validCount;
                        } else {
                            invalidCount++;
                            countInvalidSpan.innerText = invalidCount;
                        }
                        tambahKeDaftar(num, isInDb);
                    }

                    lastScannedNumber.innerText = num;
                    
                    if(isInDb) {
                        playSound('success');
                        lastScannedBadge.innerHTML = `<span class="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-xl font-bold">✔ ADA DI DATA</span>`;
                    } else {
                        playSound('error');
                        lastScannedBadge.innerHTML = `<span class="text-[10px] bg-rose-500/20 text-rose-400 border border-rose-500/30 px-3 py-1 rounded-xl font-bold">✖ TIDAK ADA</span>`;
                    }
                } else {
                    playSound('error');
                    lastScannedNumber.innerText = "Tidak Dikenali";
                    lastScannedBadge.innerHTML = `<span class="text-[10px] bg-rose-500/20 text-rose-400 px-3 py-1 rounded-xl font-bold">❌ Gagal Deteksi</span>`;
                }
            } catch (error) {
                lastScannedNumber.innerText = "Error Sistem";
                console.error(error);
            }
        }

        btnScan.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg');
            processImage(imageData);
        });

        fileUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => processImage(event.target.result);
                reader.readAsDataURL(file);
            }
        });

        function tambahKeDaftar(nomor, isInDb) {
            if(scannedNumbers.size === 1) {
                resultList.innerHTML = ''; 
            }

            const li = document.createElement('li');
            li.className = "font-mono text-slate-200 bg-slate-900/90 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center text-xs shadow-sm";
            li.dataset.number = nomor;
            li.dataset.status = isInDb ? 'ada' : 'tidak';
            
            let badge = isInDb 
                ? `<span class="text-[9px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded font-sans font-bold">✔ ADA</span>`
                : `<span class="text-[9px] bg-rose-500/20 text-rose-400 px-2 py-0.5 rounded font-sans font-bold">✖ TIDAK ADA</span>`;

            li.innerHTML = `<span class="tracking-wide">${nomor}</span> ${badge}`;
            resultList.prepend(li);
        }

        btnCopyValid.addEventListener('click', () => {
            const validItems = resultList.querySelectorAll('li[data-status="ada"]');
            if(validItems.length === 0) {
                showToast("Tidak ada resi valid untuk disalin.", "error");
                return;
            }
            const validNumbers = Array.from(validItems).map(li => li.dataset.number);
            navigator.clipboard.writeText(validNumbers.join('\n')).then(() => {
                showToast(`Berhasil menyalin ${validNumbers.length} resi valid!`, "success");
            });
        });

        btnCopyInvalid.addEventListener('click', () => {
            const invalidItems = resultList.querySelectorAll('li[data-status="tidak"]');
            if(invalidItems.length === 0) {
                showToast("Tidak ada resi tidak valid untuk disalin.", "error");
                return;
            }
            const invalidNumbers = Array.from(invalidItems).map(li => li.dataset.number);
            navigator.clipboard.writeText(invalidNumbers.join('\n')).then(() => {
                showToast(`Berhasil menyalin ${invalidNumbers.length} resi tidak valid!`, "success");
            });
        });
    </script>
</body>
</html>
