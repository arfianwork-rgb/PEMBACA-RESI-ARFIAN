<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Resi 2.0 (Kamera & Suara)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/tesseract.js@v4.1.1/dist/tesseract.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col p-4 sm:p-8">

    <div class="max-w-3xl mx-auto w-full space-y-6">
        <!-- Header -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center">
            <h1 class="text-2xl font-bold text-slate-900">Scanner Resi 2.0</h1>
            <p class="text-sm text-slate-500 mt-1">Deteksi otomatis awalan 586 & 587</p>
        </div>

        <!-- Camera Section -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center">
            <h2 class="text-lg font-semibold mb-4">Pemindai Langsung</h2>
            
            <div id="camera-container" class="hidden w-full max-w-sm rounded-xl overflow-hidden bg-black mb-4 aspect-[3/4] relative">
                <video id="video" class="w-full h-full object-cover" autoplay playsinline></video>
                <div class="absolute inset-0 border-4 border-emerald-500 border-dashed opacity-50 m-8 rounded-lg pointer-events-none"></div>
            </div>

            <canvas id="canvas" class="hidden"></canvas>

            <div class="flex flex-wrap gap-3 justify-center w-full">
                <button id="btn-start-camera" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-6 rounded-xl transition w-full sm:w-auto shadow-sm">
                    📸 Buka Kamera
                </button>
                <button id="btn-scan" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-8 rounded-xl transition w-full sm:w-auto shadow-md transform active:scale-95">
                    🔍 SCAN SEKARANG
                </button>
                <button id="btn-stop-camera" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-3 px-6 rounded-xl transition w-full sm:w-auto">
                    Tutup Kamera
                </button>
            </div>
            
            <p id="status-text" class="mt-4 text-sm font-medium text-slate-600"></p>
        </div>

        <!-- Fallback File Upload -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center">
            <p class="text-sm text-slate-500 mb-3">Atau unggah foto dari galeri:</p>
            <input type="file" id="file-upload" accept="image/*" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <!-- Hasil Scan -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold">Daftar Nomor Pesanan (<span id="count">0</span>)</h2>
                <button id="btn-copy" class="bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium py-2 px-4 rounded-lg transition">
                    Salin Semua
                </button>
            </div>
            <ul id="result-list" class="space-y-2 bg-slate-50 p-4 rounded-xl min-h-[150px] max-h-64 overflow-y-auto border border-slate-100">
                <!-- Hasil masuk kesini -->
            </ul>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusText = document.getElementById('status-text');
        const resultList = document.getElementById('result-list');
        const countSpan = document.getElementById('count');
        const containerKamera = document.getElementById('camera-container');
        
        const btnStart = document.getElementById('btn-start-camera');
        const btnScan = document.getElementById('btn-scan');
        const btnStop = document.getElementById('btn-stop-camera');
        const fileUpload = document.getElementById('file-upload');
        const btnCopy = document.getElementById('btn-copy');

        let stream = null;
        let scannedNumbers = new Set();
        // Regex untuk awalan 586 ATAU 587, diikuti 15 angka (total 18 digit)
        const orderRegex = /58[67]\d{15}/g; 

        // Fungsi Audio (Ting & Tetot)
        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            if(type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, ctx.currentTime);
                gain.gain.setValueAtTime(1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, ctx.currentTime);
                gain.gain.setValueAtTime(1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.5);
            }
        }

        // Buka Kamera Belakang
        btnStart.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
                containerKamera.classList.remove('hidden');
                btnStart.classList.add('hidden');
                btnScan.classList.remove('hidden');
                btnStop.classList.remove('hidden');
                statusText.innerText = "Kamera aktif. Arahkan ke resi lalu tekan Scan.";
                statusText.className = "mt-4 text-sm font-medium text-blue-600";
            } catch (err) {
                alert("Gagal membuka kamera: " + err.message);
            }
        });

        // Tutup Kamera
        btnStop.addEventListener('click', () => {
            if (stream) stream.getTracks().forEach(track => track.stop());
            containerKamera.classList.add('hidden');
            btnStart.classList.remove('hidden');
            btnScan.classList.add('hidden');
            btnStop.classList.add('hidden');
            statusText.innerText = "";
        });

        // Proses Pemindaian (OCR)
        async function processImage(imageSource) {
            statusText.innerText = "⏳ Sedang membaca gambar, mohon tunggu...";
            statusText.className = "mt-4 text-sm font-medium text-orange-600 animate-pulse";
            
            try {
                const result = await Tesseract.recognize(imageSource, 'eng');
                const text = result.data.text.replace(/\s+/g, ''); // Bersihkan spasi
                
                const matches = text.match(orderRegex);
                
                if (matches && matches.length > 0) {
                    let newFound = false;
                    matches.forEach(num => {
                        if (!scannedNumbers.has(num)) {
                            scannedNumbers.add(num);
                            tambahKeDaftar(num);
                            newFound = true;
                        } else {
                            statusText.innerText = `⚠️ Nomor ${num} sudah ada di daftar!`;
                        }
                    });

                    if(newFound) {
                        playSound('success');
                        statusText.innerText = "✅ Berhasil terbaca!";
                        statusText.className = "mt-4 text-sm font-bold text-emerald-600";
                    } else {
                        playSound('error');
                        statusText.className = "mt-4 text-sm font-medium text-red-600";
                    }
                } else {
                    playSound('error');
                    statusText.innerText = "❌ Gagal mendeteksi awalan 586/587 (18 digit). Coba lagi.";
                    statusText.className = "mt-4 text-sm font-medium text-red-600";
                }
            } catch (error) {
                statusText.innerText = "Terjadi kesalahan sistem.";
                console.error(error);
            }
        }

        // Ambil Foto dari Video
        btnScan.addEventListener('click', () => {
            playSound('success'); // Bunyi 'klik' kecil
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg');
            processImage(imageData);
        });

        // Ambil Foto dari File Upload (Cadangan)
        fileUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => processImage(event.target.result);
                reader.readAsDataURL(file);
            }
        });

        // Update UI Daftar
        function tambahKeDaftar(nomor) {
            const li = document.createElement('li');
            li.className = "font-mono text-slate-800 bg-white p-3 rounded-lg border border-slate-200 flex justify-between";
            li.innerHTML = `<span>${nomor}</span> <span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-1 rounded-md">Valid</span>`;
            resultList.prepend(li);
            countSpan.innerText = scannedNumbers.size;
        }

        // Copy Semua
        btnCopy.addEventListener('click', () => {
            const listData = Array.from(scannedNumbers).join('\n');
            navigator.clipboard.writeText(listData).then(() => {
                const btnAsli = btnCopy.innerText;
                btnCopy.innerText = "Tersalin!";
                btnCopy.classList.replace('bg-slate-800', 'bg-emerald-600');
                setTimeout(() => {
                    btnCopy.innerText = btnAsli;
                    btnCopy.classList.replace('bg-emerald-600', 'bg-slate-800');
                }, 2000);
            });
        });
    </script>
</body>
</html>
