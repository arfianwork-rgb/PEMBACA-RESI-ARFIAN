<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Resi v3.0 Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/tesseract.js@v4.1.1/dist/tesseract.min.js"></script>
    <!-- Pustaka untuk Ekspor Excel (.xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Plus Jakarta Sans', sans-serif; } 
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-animate {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between m-0 p-0 overflow-x-hidden pb-24">

    <!-- Header & Dashboard Utama -->
    <div id="main-dashboard" class="w-full max-w-md mx-auto p-4 space-y-3 flex-1 flex flex-col">
        <!-- Header Atas ala Android App Bar -->
        <div class="bg-slate-900/90 backdrop-blur-md px-4 py-3 rounded-2xl border border-slate-800 flex justify-between items-center shadow-lg">
            <div>
                <h1 class="text-sm font-bold text-white tracking-tight">Database Resi v3.0</h1>
                <p id="db-status" class="text-[11px] text-amber-400 mt-0.5">Menghubungkan Google Sheets...</p>
            </div>
            <div class="flex items-center gap-1.5 bg-slate-950/60 px-2.5 py-1 rounded-full border border-slate-800">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-[10px] font-semibold text-slate-300">Online</span>
            </div>
        </div>

        <!-- Panel Total Valid & Sisa Belum Discan di Tengah -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-900/90 backdrop-blur-md p-3.5 rounded-2xl border border-emerald-500/30 text-center shadow-lg">
                <span class="block text-2xl font-extrabold text-emerald-400 tracking-tight" id="count-valid">0</span>
                <span class="text-[10px] uppercase tracking-wider text-emerald-400/80 font-bold mt-1 block">✔ Sudah Discan</span>
            </div>
            <div class="bg-slate-900/90 backdrop-blur-md p-3.5 rounded-2xl border border-amber-500/30 text-center shadow-lg">
                <span class="block text-2xl font-extrabold text-amber-400 tracking-tight" id="count-remaining">0</span>
                <span class="text-[10px] uppercase tracking-wider text-amber-400/80 font-bold mt-1 block">⏳ Belum Discan</span>
            </div>
        </div>

        <!-- BAGIAN UTAMA: RIWAYAT SUDAH DISCAN -->
        <div class="bg-slate-900/80 backdrop-blur-md p-3.5 rounded-2xl border border-slate-800 flex flex-col shadow-lg space-y-2">
            <div class="flex justify-between items-center">
                <h3 class="text-xs font-bold text-emerald-400 uppercase tracking-wider">📦 Riwayat Sudah Discan</h3>
                <div class="flex gap-2">
                    <label class="text-[11px] text-blue-400 hover:text-blue-300 font-semibold underline cursor-pointer">
                        Galeri
                        <input type="file" id="file-upload" accept="image/*" class="hidden">
                    </label>
                    <span class="text-slate-600">|</span>
                    <button id="btn-clear-history" class="text-[11px] text-rose-400 hover:text-rose-300 font-semibold underline">Hapus Sesi</button>
                </div>
            </div>

            <!-- Kotak Pencarian Cepat (Search Filter) -->
            <div class="relative">
                <input type="text" id="search-history" placeholder="🔍 Cari nomor resi atau nama toko..." class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500/50">
            </div>

            <!-- Tombol Aksi Riwayat -->
            <div class="grid grid-cols-3 gap-1.5">
                <button id="btn-copy-valid" class="bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/40 text-emerald-400 text-[10px] font-semibold py-1.5 px-1 rounded-xl transition shadow-sm flex items-center justify-center gap-1">
                    <span>📋</span> Salin
                </button>
                <button id="btn-export-xlsx" class="bg-blue-600/20 hover:bg-blue-600/30 border border-blue-500/40 text-blue-400 text-[10px] font-semibold py-1.5 px-1 rounded-xl transition shadow-sm flex items-center justify-center gap-1">
                    <span>📊</span> Export XLSX
                </button>
                <button id="btn-copy-invalid" class="bg-rose-600/20 hover:bg-rose-600/30 border border-rose-500/40 text-rose-400 text-[10px] font-semibold py-1.5 px-1 rounded-xl transition shadow-sm flex items-center justify-center gap-1">
                    <span>⚠️</span> Invalid
                </button>
            </div>

            <!-- List Sudah Discan -->
            <ul id="result-list" class="space-y-1.5 bg-slate-950/60 p-2.5 rounded-xl max-h-44 overflow-y-auto border border-slate-800/80">
                <li class="text-center text-slate-500 text-xs py-4">Belum ada resi yang dipindai hari ini</li>
            </ul>
        </div>

        <!-- PANEL TOMBOL & DAFTAR SISA BELUM DISCAN -->
        <div class="bg-slate-900/80 backdrop-blur-md p-3.5 rounded-2xl border border-slate-800 flex flex-col shadow-lg space-y-2">
            <div class="grid grid-cols-2 gap-1.5">
                <button id="btn-toggle-remaining" class="bg-amber-600/20 hover:bg-amber-600/30 border border-amber-500/40 text-amber-400 text-[10px] font-bold py-2 px-2 rounded-xl transition shadow-sm flex items-center justify-center gap-1">
                    <span>🔍</span> <span id="toggle-text">Cek Sisa Belum Discan</span>
                </button>
                <button id="btn-copy-remaining" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-[10px] font-bold py-2 px-2 rounded-xl transition shadow-sm flex items-center justify-center gap-1">
                    <span>📋</span> Salin Semua Sisa
                </button>
            </div>

            <!-- Kontainer Daftar Sisa -->
            <div id="remaining-container" class="hidden space-y-2 pt-1 border-t border-slate-800">
                <ul id="remaining-list" class="space-y-1.5 bg-slate-950/60 p-2.5 rounded-xl max-h-40 overflow-y-auto border border-slate-800/80">
                    <li class="text-center text-slate-500 text-xs py-4">Memuat data...</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-6 py-2.5 flex justify-around items-center shadow-2xl">
        <button onclick="autoSyncDatabase()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition active:scale-95">
            <span class="text-lg bg-slate-800/80 p-2 rounded-xl border border-slate-700">🔄</span>
            <span class="text-[10px] font-bold tracking-wide">Muat Ulang</span>
        </button>

        <button id="btn-start-camera" class="flex flex-col items-center gap-1 text-blue-400 hover:text-blue-300 transition active:scale-95 -mt-3">
            <span class="text-xl bg-blue-600 text-white p-3 rounded-full shadow-lg shadow-blue-600/50 border border-blue-400/40">📷</span>
            <span class="text-[10px] font-bold tracking-wide text-white">Pindai</span>
        </button>

        <button onclick="showToast('Sistem v3.0 Enterprise Aktif', 'success')" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-300 transition active:scale-95">
            <span class="text-lg bg-slate-800/50 p-2 rounded-xl border border-slate-700/50">⚡</span>
            <span class="text-[10px] font-bold tracking-wide">v3.0</span>
        </button>
    </nav>

    <!-- Area Utama Kamera Full Screen -->
    <main id="camera-wrapper" class="hidden fixed inset-0 z-50 bg-black flex flex-col justify-between">
        <div class="relative w-full flex-1 bg-black overflow-hidden">
            <video id="video" class="w-full h-full object-cover" autoplay playsinline></video>
            <div class="absolute inset-0 border-2 border-emerald-400 border-dashed opacity-60 m-10 rounded-3xl pointer-events-none animate-pulse"></div>
        </div>
        <canvas id="canvas" class="hidden"></canvas>

        <footer class="w-full bg-slate-900/95 backdrop-blur-md p-4 border-t border-slate-800 space-y-3">
            <div class="bg-slate-950/80 border border-slate-800 p-3 rounded-2xl flex items-center justify-between">
                <div class="overflow-hidden pr-2">
                    <span class="text-[10px] uppercase font-semibold text-slate-400 block">Resi Terakhir:</span>
                    <span id="last-scanned-number" class="text-sm font-mono font-bold text-slate-200 tracking-wide">-</span>
                </div>
                <div id="last-scanned-badge">
                    <span class="text-[10px] bg-slate-800 text-slate-400 px-3 py-1 rounded-xl font-medium">Belum ada scan</span>
                </div>
            </div>

            <div class="flex gap-2">
                <button id="btn-scan" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg shadow-emerald-600/25 active:scale-95 transition text-sm flex items-center justify-center gap-2">
                    <span>🔍</span> AMBIL / SCAN RESI
                </button>
                <button id="btn-stop-camera" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-3.5 px-5 rounded-2xl text-xs transition">
                    Tutup
                </button>
            </div>
        </footer>
    </main>

    <div id="toast-container" class="fixed bottom-20 left-0 right-0 z-50 flex justify-center px-4 pointer-events-none"></div>

    <script>
        const FIXED_SHEETS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTrePM4XsuFuQXkiAxKVT6pEaAWFfIFcrrplLmkm0JuH4zJTJnY2hMSQ3uBRMEaQdRm-QBeCdPGeTjv/pub?output=csv";
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwmpw1m-seyf7ti699vmtQp32qSP8P1Ql2Ce8jtCdp5OWlUWWoUhvpd4WzjboBFHZtv/exec"; 
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const resultList = document.getElementById('result-list');
        const remainingList = document.getElementById('remaining-list');
        const remainingContainer = document.getElementById('remaining-container');
        const toggleText = document.getElementById('toggle-text');
        const searchHistory = document.getElementById('search-history');
        const toastContainer = document.getElementById('toast-container');
        
        const countValidSpan = document.getElementById('count-valid');
        const countRemainingSpan = document.getElementById('count-remaining');
        
        const mainDashboard = document.getElementById('main-dashboard');
        const cameraWrapper = document.getElementById('camera-wrapper');
        const bottomNav = document.querySelector('nav');
        
        const btnStart = document.getElementById('btn-start-camera');
        const btnScan = document.getElementById('btn-scan');
        const btnStop = document.getElementById('btn-stop-camera');
        const fileUpload = document.getElementById('file-upload');
        
        const btnCopyValid = document.getElementById('btn-copy-valid');
        const btnCopyInvalid = document.getElementById('btn-copy-invalid');
        const btnCopyRemaining = document.getElementById('btn-copy-remaining');
        const btnToggleRemaining = document.getElementById('btn-toggle-remaining');
        const btnExportXlsx = document.getElementById('btn-export-xlsx');
        const btnClearHistory = document.getElementById('btn-clear-history');
        
        const dbStatus = document.getElementById('db-status');
        const lastScannedNumber = document.getElementById('last-scanned-number');
        const lastScannedBadge = document.getElementById('last-scanned-badge');

        let stream = null;
        let scannedNumbers = new Set(JSON.parse(localStorage.getItem('v3_scannedNumbers') || '[]'));
        let scanHistoryData = JSON.parse(localStorage.getItem('v3_scanHistoryData') || '[]'); 
        let validCount = parseInt(localStorage.getItem('v3_validCount') || '0');
        let masterDatabase = new Map(); 
        const orderRegex = /58[67]\d{15}/g; 

        function showToast(message, type = 'info') {
            toastContainer.innerHTML = '';
            const toast = document.createElement('div');
            toast.className = `toast-animate pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl shadow-2xl border text-xs font-semibold backdrop-blur-xl transition-all max-w-sm w-full`;
            
            if(type === 'success') {
                toast.className += ` bg-emerald-950/90 border-emerald-500/50 text-emerald-200`;
                toast.innerHTML = `<span class="text-base">✨</span> <span>${message}</span>`;
            } else if(type === 'error') {
                toast.className += ` bg-rose-950/90 border-rose-500/50 text-rose-200`;
                toast.innerHTML = `<span class="text-base">⚠️</span> <span>${message}</span>`;
            } else if(type === 'warn') {
                toast.className += ` bg-amber-950/90 border-amber-500/50 text-amber-200`;
                toast.innerHTML = `<span class="text-base">🔄</span> <span>${message}</span>`;
            } else {
                toast.className += ` bg-slate-900/90 border-slate-700 text-slate-200`;
                toast.innerHTML = `<span class="text-base">📌</span> <span>${message}</span>`;
            }
            
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function saveToLocalStorage() {
            localStorage.setItem('v3_scannedNumbers', JSON.stringify(Array.from(scannedNumbers)));
            localStorage.setItem('v3_scanHistoryData', JSON.stringify(scanHistoryData));
            localStorage.setItem('v3_validCount', validCount.toString());
        }

        function renderHistoryList(filterQuery = '') {
            resultList.innerHTML = '';
            const filteredData = scanHistoryData.filter(item => 
                item.resi.toLowerCase().includes(filterQuery.toLowerCase()) || 
                item.toko.toLowerCase().includes(filterQuery.toLowerCase()) ||
                item.produk.toLowerCase().includes(filterQuery.toLowerCase())
            );

            if(filteredData.length === 0) {
                resultList.innerHTML = `<li class="text-center text-slate-500 text-xs py-4">Tidak ada riwayat yang cocok</li>`;
                return;
            }

            filteredData.forEach(item => {
                const li = document.createElement('li');
                if (item.status === 'VALID') {
                    li.className = "font-mono text-emerald-100 bg-emerald-950/50 p-2.5 rounded-xl border border-emerald-500/30 text-xs shadow-sm space-y-1";
                    li.innerHTML = `
                        <div class="flex justify-between items-center"><span class="tracking-wide font-bold">${item.resi}</span><span class="text-[9px] bg-emerald-500/30 px-2 py-0.5 rounded font-sans text-emerald-200">VALID (${item.waktu})</span></div>
                        <div class="text-[10px] text-emerald-300/80 font-sans grid grid-cols-2 gap-1 pt-1 border-t border-emerald-500/20">
                            <div>Toko: <b>${item.toko}</b></div>
                            <div>Kurir: <b>${item.kurir}</b></div>
                            <div class="col-span-2">Produk: <b>${item.produk}</b></div>
                        </div>`;
                } else {
                    li.className = "font-mono text-rose-100 bg-rose-950/50 p-2.5 rounded-xl border border-rose-500/30 text-xs shadow-sm";
                    li.innerHTML = `<div class="flex justify-between items-center"><span class="tracking-wide font-bold">${item.resi}</span><span class="text-[9px] bg-rose-500/30 px-2 py-0.5 rounded font-sans text-rose-200">TIDAK ADA (${item.waktu})</span></div>`;
                }
                resultList.appendChild(li);
            });
        }

        async function autoSyncDatabase() {
            try {
                dbStatus.innerText = "Memuat database...";
                const response = await fetch(FIXED_SHEETS_URL);
                const csvText = await response.text();
                
                masterDatabase.clear();
                const lines = csvText.split(/\r?\n/);

                lines.forEach((line, index) => {
                    if (index === 0) return;
                    const cols = line.split(',').map(c => c.replace(/["']/g, "").trim());
                    if (cols.length >= 1) {
                        const resi = cols[0];
                        const toko = cols[1] || "-";
                        const kurir = cols[2] || "-";
                        const produk = cols[3] || "-";

                        const matches = resi.match(orderRegex);
                        if (matches) {
                            matches.forEach(m => {
                                masterDatabase.set(m, { toko, kurir, produk });
                            });
                        } else if (resi.length >= 10) {
                            masterDatabase.set(resi, { toko, kurir, produk });
                        }
                    }
                });

                if(masterDatabase.size > 0) {
                    dbStatus.innerText = `Terhubung (${masterDatabase.size} resi aktif)`;
                    dbStatus.className = "text-[11px] text-emerald-400 mt-0.5";
                    countValidSpan.innerText = validCount;
                    renderHistoryList();
                    updateRemainingDisplay();
                    showToast("Database v3.0 berhasil disinkronkan!", "success");
                } else {
                    dbStatus.innerText = "Database kosong / format salah";
                    dbStatus.className = "text-[11px] text-amber-400 mt-0.5";
                }
            } catch (err) {
                dbStatus.innerText = "Gagal memuat database online";
                dbStatus.className = "text-[11px] text-rose-400 mt-0.5";
                showToast("Gagal terhubung ke Google Sheets.", "error");
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            autoSyncDatabase();
            countValidSpan.innerText = validCount;
            renderHistoryList();
        });

        searchHistory.addEventListener('input', (e) => {
            renderHistoryList(e.target.value);
        });

        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            if(type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, ctx.currentTime);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.3);
            } else if(type === 'warn') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500, ctx.currentTime);
                gain.gain.setValueAtTime(0.4, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, ctx.currentTime);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.5);
            }
        }

        btnStart.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
                mainDashboard.classList.add('hidden');
                bottomNav.classList.add('hidden'); 
                cameraWrapper.classList.remove('hidden');
            } catch (err) {
                showToast("Gagal membuka kamera: " + err.message, "error");
            }
        });

        btnStop.addEventListener('click', () => {
            if (stream) stream.getTracks().forEach(track => track.stop());
            cameraWrapper.classList.add('hidden');
            mainDashboard.classList.remove('hidden');
            bottomNav.classList.remove('hidden'); 
        });

        async function processImage(imageSource) {
            lastScannedNumber.innerText = "Memproses...";
            lastScannedBadge.innerHTML = `<span class="text-[10px] bg-amber-500/20 text-amber-400 px-3 py-1 rounded-xl font-medium animate-pulse">⏳ Membaca OCR...</span>`;
            
            try {
                const result = await Tesseract.recognize(imageSource, 'eng');
                const text = result.data.text.replace(/\s+/g, ''); 
                const matches = text.match(orderRegex);
                
                if (matches && matches.length > 0) {
                    let num = matches[0]; 
                    
                    let isInDb = false;
                    let meta = { toko: "-", kurir: "-", produk: "-" };

                    if (masterDatabase.size > 0 && masterDatabase.has(num)) {
                        isInDb = true;
                        meta = masterDatabase.get(num);
                    } else if (masterDatabase.size === 0) {
                        isInDb = true; 
                    }

                    if (scannedNumbers.has(num)) {
                        playSound('warn');
                        lastScannedNumber.innerText = num;
                        lastScannedBadge.innerHTML = `<span class="text-[10px] bg-amber-500/20 text-amber-400 border border-amber-500/30 px-3 py-1 rounded-bold">⚠️ SUDAH PERNAH DI-SCAN</span>`;
                        showToast(`Resi ${num} sudah pernah di-scan sebelumnya!`, "warn");
                        return;
                    }

                    scannedNumbers.add(num);
                    if (isInDb) {
                        validCount++;
                        countValidSpan.innerText = validCount;
                    }

                    scanHistoryData.unshift({
                        resi: num,
                        invoice: num,
                        toko: meta.toko,
                        kurir: meta.kurir,
                        produk: meta.produk,
                        status: isInDb ? 'VALID' : 'TIDAK VALID',
                        waktu: new Date().toLocaleTimeString()
                    });

                    saveToLocalStorage();
                    renderHistoryList();
                    updateRemainingDisplay(); 
                    lastScannedNumber.innerText = num;
                    
                    if(APPS_SCRIPT_URL && isInDb) {
                        fetch(`${APPS_SCRIPT_URL}?resi=${num}&status=Berhasil%20Scan`, { mode: 'no-cors' }).catch(e => console.log(e));
                    }

                    if(isInDb) {
                        playSound('success');
                        lastScannedBadge.innerHTML = `<span class="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-bold">✔ ADA (${meta.toko})</span>`;
                    } else {
                        playSound('error');
                        lastScannedBadge.innerHTML = `<span class="text-[10px] bg-rose-500/20 text-rose-400 px-3 py-1 rounded-bold">✖ TIDAK ADA</span>`;
                    }
                } else {
                    playSound('error');
                    lastScannedNumber.innerText = "Tidak Dikenali";
                    lastScannedBadge.innerHTML = `<span class="text-[10px] bg-rose-500/20 text-rose-400 px-3 py-1 rounded-bold">❌ Gagal Deteksi</span>`;
                }
            } catch (error) {
                lastScannedNumber.innerText = "Error Sistem";
                console.error(error);
            }
        }

        btnScan.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg');
            processImage(imageData);
        });

        fileUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => processImage(event.target.result);
                reader.readAsDataURL(file);
            }
        });

        function updateRemainingDisplay() {
            if(masterDatabase.size === 0) return;

            let remainingListArray = [];
            masterDatabase.forEach((meta, resi) => {
                if(!scannedNumbers.has(resi)) {
                    remainingListArray.push({ resi, ...meta });
                }
            });

            countRemainingSpan.innerText = remainingListArray.length;
            remainingList.innerHTML = '';

            if(remainingListArray.length === 0) {
                remainingList.innerHTML = `<li class="text-center text-emerald-400 text-xs py-4 font-semibold">✨ Semua resi di database sudah selesai discan!</li>`;
                return;
            }

            remainingListArray.forEach(item => {
                const li = document.createElement('li');
                li.className = "font-mono text-amber-100 bg-amber-950/40 p-2.5 rounded-xl border border-amber-500/30 text-xs shadow-sm space-y-1";
                li.innerHTML = `
                    <div class="flex justify-between items-center"><span class="tracking-wide font-bold">${item.resi}</span><span class="text-[9px] bg-amber-500/30 px-2 py-0.5 rounded font-sans text-amber-200">BELUM</span></div>
                    <div class="text-[10px] text-amber-300/80 font-sans grid grid-cols-2 gap-1 pt-1 border-t border-amber-500/20">
                        <div>Toko: <b>${item.toko}</b></div>
                        <div>Kurir: <b>${item.kurir}</b></div>
                        <div class="col-span-2">Produk: <b>${item.produk}</b></div>
                    </div>`;
                remainingList.appendChild(li);
            });
        }

        btnToggleRemaining.addEventListener('click', () => {
            if(masterDatabase.size === 0) {
                showToast("Database belum termuat.", "error");
                return;
            }
            if(remainingContainer.classList.contains('hidden')) {
                remainingContainer.classList.remove('hidden');
                toggleText.innerText = "Sembunyikan Sisa";
            } else {
                remainingContainer.classList.add('hidden');
                toggleText.innerText = "Cek Sisa Belum Discan";
            }
        });

        btnClearHistory.addEventListener('click', () => {
            if(scannedNumbers.size === 0) {
                showToast("Riwayat sudah kosong.", "info");
                return;
            }
            if(confirm("Yakin ingin menghapus seluruh riwayat dan cache sesi ini?")) {
                scannedNumbers.clear();
                scanHistoryData = [];
                validCount = 0;
                localStorage.clear();
                countValidSpan.innerText = "0";
                renderHistoryList();
                updateRemainingDisplay();
                showToast("Riwayat dan memori sesi dibersihkan.", "success");
            }
        });

        btnCopyValid.addEventListener('click', () => {
            const validItems = scanHistoryData.filter(item => item.status === 'VALID');
            if(validItems.length === 0) {
                showToast("Tidak ada resi valid untuk disalin.", "error");
                return;
            }
            const validNumbers = validItems.map(item => item.resi);
            navigator.clipboard.writeText(validNumbers.join('\n')).then(() => {
                showToast(`Berhasil menyalin ${validNumbers.length} resi valid!`, "success");
            });
        });

        btnCopyInvalid.addEventListener('click', () => {
            const invalidItems = scanHistoryData.filter(item => item.status === 'TIDAK VALID');
            if(invalidItems.length === 0) {
                showToast("Tidak ada resi tidak valid untuk disalin.", "error");
                return;
            }
            const invalidNumbers = invalidItems.map(item => item.resi);
            navigator.clipboard.writeText(invalidNumbers.join('\n')).then(() => {
                showToast(`Berhasil menyalin ${invalidNumbers.length} resi tidak valid!`, "success");
            });
        });

        btnCopyRemaining.addEventListener('click', () => {
            let remainingNumbers = [];
            masterDatabase.forEach((meta, resi) => {
                if(!scannedNumbers.has(resi)) {
                    remainingNumbers.push(resi);
                }
            });

            if(remainingNumbers.length === 0) {
                showToast("Tidak ada sisa resi yang belum discan.", "info");
                return;
            }

            navigator.clipboard.writeText(remainingNumbers.join('\n')).then(() => {
                showToast(`Berhasil menyalin ${remainingNumbers.length} sisa resi belum discan!`, "success");
            });
        });

        btnExportXlsx.addEventListener('click', () => {
            if(scanHistoryData.length === 0) {
                showToast("Belum ada data resi untuk diexport.", "error");
                return;
            }

            const exportRows = scanHistoryData.map((item, idx) => ({
                "No": idx + 1,
                "Nomor Resi / Invoice": item.resi,
                "Nama Toko": item.toko,
                "Kurir Pickup": item.kurir,
                "Nama Produk": item.produk,
                "Status Scan": item.status,
                "Waktu Scan": item.waktu
            }));

            const worksheet = XLSX.utils.json_to_sheet(exportRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Laporan Scan Resi v3.0");

            const dateStr = new Date().toISOString().slice(0,10);
            XLSX.writeFile(workbook, `Laporan_Resi_v3_${dateStr}.xlsx`);
            showToast("File XLSX berhasil diunduh!", "success");
        });
    </script>
</body>
</html>
