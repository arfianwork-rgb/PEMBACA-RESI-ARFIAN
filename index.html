<!DOCTYPE html>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between m-0 p-0 overflow-x-hidden pb-28">

    <!-- Header & Dashboard Utama -->

        <!-- Header Atas -->

            <!-- Kotak Pencarian -->

            <!-- Tombol Aksi Riwayat -->

            <!-- Kontainer Daftar Sisa Tersembunyi -->

    <!-- Halaman Login USER (Tersembunyi secara Default) -->

        <div class="glass-panel w-full max-w-sm p-6 rounded-3xl space-y-5 shadow-2xl border border-slate-800">

                    Masuk

    <!-- Bottom Navigation Bar Mengambang -->
    <nav class="fixed bottom-4 left-4 right-4 z-40 bg-slate-900/90 backdrop-blur-2xl border border-slate-800/80 px-6 py-3 rounded-3xl flex justify-around items-center shadow-2xl max-w-md mx-auto">
        <button onclick="autoSyncDatabase()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition active:scale-90">
            <span class="text-xs font-bold bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700/60 shadow-inner">SYNC</span>
            <span class="text-[9px] font-bold tracking-wider uppercase">Muat Ulang</span>
        </button>

        <button id="btn-start-camera" class="flex flex-col items-center gap-1 text-cyan-400 hover:text-cyan-300 transition active:scale-90 -mt-6">
            <span class="text-xs font-extrabold bg-gradient-to-tr from-cyan-500 to-blue-600 text-white px-5 py-3 rounded-2xl shadow-xl shadow-cyan-500/40 border border-cyan-300/30 uppercase tracking-widest">PINDAI</span>
        </button>

        <button id="btn-open-login" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-300 transition active:scale-90">

    <!-- Area Utama Kamera Full Screen -->
    <main id="camera-wrapper" class="hidden fixed inset-0 z-50 bg-black flex flex-col justify-between">
        <div class="relative w-full flex-1 bg-black overflow-hidden">
            <video id="video" class="w-full h-full object-cover" autoplay playsinline></video>
            <div class="absolute inset-0 border-2 border-cyan-400/80 border-dashed opacity-75 m-12 rounded-3xl pointer-events-none animate-pulse"></div>
        </div>
        <canvas id="canvas" class="hidden"></canvas>

        <footer class="w-full bg-slate-900/95 backdrop-blur-2xl p-4 border-t border-slate-800 space-y-3 rounded-t-3xl shadow-2xl">
            <div class="bg-slate-950/80 border border-slate-800/80 p-3.5 rounded-2xl flex items-center justify-between">
                <div class="overflow-hidden pr-2">
                    <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider block">Resi Terakhir:</span>
                    <span id="last-scanned-number" class="text-sm font-mono font-bold text-cyan-300 tracking-wide">-</span>
                </div>
                <div id="last-scanned-badge">
                    <span class="text-[10px] bg-slate-800 text-slate-400 px-3 py-1.5 rounded-xl font-medium">Belum ada scan</span>
                </div>
            </div>

            <div class="flex gap-2.5">
                <button id="btn-scan" class="flex-1 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-extrabold py-3.5 px-4 rounded-2xl shadow-lg shadow-cyan-500/30 active:scale-95 transition text-sm flex items-center justify-center uppercase tracking-wider">
                    Ambil / Scan Resi
                </button>
                <button id="btn-stop-camera" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3.5 px-5 rounded-2xl text-xs transition active:scale-95 border border-slate-700">
                    Tutup

    <div id="toast-container" class="fixed bottom-24 left-0 right-0 z-50 flex justify-center px-4 pointer-events-none"></div>

    <script>
        // Menggunakan endpoint Apps Script untuk mengambil data database secara aman tanpa blokir CORS
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwmpw1m-seyf7ti699vmtQp32qSP8P1Ql2Ce8jtCdp5OWlUWWoUhvpd4WzjboBFHZtv/exec"; 

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const resultList = document.getElementById('result-list');
        const remainingList = document.getElementById('remaining-list');
        const remainingContainer = document.getElementById('remaining-container');
        const toggleText = document.getElementById('toggle-text');
        const searchHistory = document.getElementById('search-history');
        const toastContainer = document.getElementById('toast-container');
        
        const mainDashboard = document.getElementById('main-dashboard');
        const cameraWrapper = document.getElementById('camera-wrapper');
        const bottomNav = document.querySelector('nav');
        
        const btnStart = document.getElementById('btn-start-camera');
        const btnScan = document.getElementById('btn-scan');
        const btnStop = document.getElementById('btn-stop-camera');
        const fileUpload = document.getElementById('file-upload');
        
        const btnCopyValid = document.getElementById('btn-copy-valid');
        const btnCopyInvalid = document.getElementById('btn-copy-invalid');
        const btnCopyRemaining = document.getElementById('btn-copy-remaining');
        const btnToggleRemaining = document.getElementById('btn-toggle-remaining');
        const btnExportXlsx = document.getElementById('btn-export-xlsx');
        const btnClearHistory = document.getElementById('btn-clear-history');
        
        const loginWrapper = document.getElementById('login-wrapper');
        const btnOpenLogin = document.getElementById('btn-open-login');
        const btnCloseLogin = document.getElementById('btn-close-login');
        const btnSubmitLogin = document.getElementById('btn-submit-login');
        const loginUseridInput = document.getElementById('login-userid');
        const loginPassInput = document.getElementById('login-pass');
        const navUserLabel = document.getElementById('nav-user-label');

        const dbStatus = document.getElementById('db-status');
        const lastScannedNumber = document.getElementById('last-scanned-number');
        const lastScannedBadge = document.getElementById('last-scanned-badge');

        let stream = null;
        let scannedNumbers = new Set(JSON.parse(localStorage.getItem('v3_scannedNumbers') || '[]'));
        let scanHistoryData = JSON.parse(localStorage.getItem('v3_scanHistoryData') || '[]'); 
        let validCount = parseInt(localStorage.getItem('v3_validCount') || '0');
        let currentUser = localStorage.getItem('v3_currentUser') || '';
        let masterDatabase = new Map(); 
        const orderRegex = /58[67]\d{15}/g; 

        if(currentUser) {
            navUserLabel.innerText = currentUser.length > 5 ? currentUser.substring(0, 5) + '..' : currentUser;
        }

        btnOpenLogin.addEventListener('click', () => {
            loginWrapper.classList.remove('hidden');
            mainDashboard.classList.add('hidden');
            bottomNav.classList.add('hidden');
        });

        btnCloseLogin.addEventListener('click', () => {
            loginWrapper.classList.add('hidden');
            mainDashboard.classList.remove('hidden');
            bottomNav.classList.remove('hidden');
        });

        btnSubmitLogin.addEventListener('click', () => {
            let uid = loginUseridInput.value.trim();
            let pass = loginPassInput.value.trim();

            if(!uid) {
                showToast("User ID tidak boleh kosong", "error");
                return;
            }

            currentUser = uid;
            localStorage.setItem('v3_currentUser', currentUser);
            navUserLabel.innerText = currentUser.length > 5 ? currentUser.substring(0, 5) + '..' : currentUser;
            
            showToast(`Login berhasil sebagai: ${currentUser}`, "success");
            loginUseridInput.value = '';
            loginPassInput.value = '';

            loginWrapper.classList.add('hidden');
            mainDashboard.classList.remove('hidden');
            bottomNav.classList.remove('hidden');
        });

        function showToast(message, type = 'info') {
            toastContainer.innerHTML = '';
            const toast = document.createElement('div');
            toast.className = `toast-animate pointer-events-auto flex items-center justify-center gap-3 px-4 py-3 rounded-2xl shadow-2xl border text-xs font-bold backdrop-blur-2xl transition-all max-w-sm w-full`;
            
            if(type === 'success') {
                toast.className += ` bg-emerald-950/90 border-emerald-500/50 text-emerald-200`;
            } else if(type === 'error') {
                toast.className += ` bg-rose-950/90 border-rose-500/50 text-rose-200`;
            } else if(type === 'warn') {
                toast.className += ` bg-amber-950/90 border-amber-500/50 text-amber-200`;
            } else {
                toast.className += ` bg-slate-900/90 border-slate-700 text-slate-200`;
            }
            
            toast.innerText = message;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function saveToLocalStorage() {
            localStorage.setItem('v3_scannedNumbers', JSON.stringify(Array.from(scannedNumbers)));
            localStorage.setItem('v3_scanHistoryData', JSON.stringify(scanHistoryData));
            localStorage.setItem('v3_validCount', validCount.toString());
        }

        function renderHistoryList(filterQuery = '') {
            resultList.innerHTML = '';
            const filteredData = scanHistoryData.filter(item => 
                item.resi.toLowerCase().includes(filterQuery.toLowerCase()) || 
                item.toko.toLowerCase().includes(filterQuery.toLowerCase()) ||
                item.produk.toLowerCase().includes(filterQuery.toLowerCase())
            );

            if(filteredData.length === 0) {
                resultList.innerHTML = `<li class="text-center text-slate-500 text-xs py-5">Tidak ada riwayat yang cocok</li>`;
                return;
            }

            filteredData.forEach(item => {
                const li = document.createElement('li');
                if (item.status === 'VALID') {
                    li.className = "font-mono text-emerald-100 bg-emerald-950/40 p-3 rounded-2xl border border-emerald-500/25 text-xs shadow-sm space-y-1.5 backdrop-blur-md";
                    li.innerHTML = `
                        <div class="flex justify-between items-center"><span class="tracking-wide font-bold text-emerald-300">${item.resi}</span><span class="text-[9px] bg-emerald-500/20 px-2 py-0.5 rounded-full font-sans font-bold text-emerald-200 border border-emerald-500/30 uppercase">VALID (${item.waktu})</span></div>
                        <div class="text-[10px] text-emerald-200/70 font-sans grid grid-cols-2 gap-1 pt-1.5 border-t border-emerald-500/20">
                            <div>Toko: <b class="text-white">${item.toko}</b></div>
                            <div>Kurir: <b class="text-white">${item.kurir}</b></div>
                            <div class="col-span-2">Produk: <b class="text-white">${item.produk}</b></div>
                        </div>`;
                } else {
                    li.className = "font-mono text-rose-100 bg-rose-950/40 p-3 rounded-2xl border border-rose-500/25 text-xs shadow-sm backdrop-blur-md";
                    li.innerHTML = `<div class="flex justify-between items-center"><span class="tracking-wide font-bold text-rose-300">${item.resi}</span><span class="text-[9px] bg-rose-500/20 px-2 py-0.5 rounded-full font-sans font-bold text-rose-200 border border-rose-500/30 uppercase">TIDAK ADA (${item.waktu})</span></div>`;
                }
                resultList.appendChild(li);
            });
        }

        // Fungsi sinkronisasi diperbarui agar menarik data langsung dari Apps Script (Menghindari Error CORS & Link CSV mati)
        async function autoSyncDatabase() {
            try {
                dbStatus.innerText = "Memuat database...";
                const response = await fetch(`${APPS_SCRIPT_URL}?action=getData`, {
                    method: 'GET',
                    redirect: 'follow'
                });
                const rows = await response.json();
                
                masterDatabase.clear();
                
                if (Array.isArray(rows)) {
                    rows.forEach((cols, index) => {
                        if (index === 0) return; // Lewati header
                        if (cols.length >= 1 && cols[0]) {
                            const resi = cols[0].toString().trim();
                            const toko = cols[1] ? cols[1].toString().trim() : "-";
                            const kurir = cols[2] ? cols[2].toString().trim() : "-";
                            const produk = cols[3] ? cols[3].toString().trim() : "-";

                            const matches = resi.match(orderRegex);
                            if (matches) {
                                matches.forEach(m => {
                                    masterDatabase.set(m, { toko, kurir, produk });
                                });
                            } else if (resi.length >= 10) {
                                masterDatabase.set(resi, { toko, kurir, produk });
                            }
                        }
                    });
                }

                if(masterDatabase.size > 0) {
                    dbStatus.innerText = `Terhubung (${masterDatabase.size} resi aktif)`;
                    dbStatus.className = "text-[11px] text-cyan-400 font-bold mt-0.5";
                    countValidSpan.innerText = validCount;
                    renderHistoryList();
                    updateRemainingDisplay();
                    showToast("Database v3.1 tersinkronisasi", "success");
                } else {
                    dbStatus.innerText = "Database kosong / format salah";
                    dbStatus.className = "text-[11px] text-amber-400 font-bold mt-0.5";
                }
            } catch (err) {
                dbStatus.innerText = "Gagal memuat database online";
                dbStatus.className = "text-[11px] text-rose-400 font-bold mt-0.5";
                showToast("Gagal terhubung ke Google Sheets", "error");
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            autoSyncDatabase();
            countValidSpan.innerText = validCount;
            renderHistoryList();
        });

        searchHistory.addEventListener('input', (e) => {
            renderHistoryList(e.target.value);
        });

        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            if(type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, ctx.currentTime);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.3);
            } else if(type === 'warn') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500, ctx.currentTime);
                gain.gain.setValueAtTime(0.4, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, ctx.currentTime);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.5);
            }
        }

        btnStart.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
                mainDashboard.classList.add('hidden');
                bottomNav.classList.add('hidden'); 
                cameraWrapper.classList.remove('hidden');
            } catch (err) {
                showToast("Gagal membuka kamera: " + err.message, "error");
            }
        });

        btnStop.addEventListener('click', () => {
            if (stream) stream.getTracks().forEach(track => track.stop());
            cameraWrapper.classList.add('hidden');
            mainDashboard.classList.remove('hidden');
            bottomNav.classList.remove('hidden'); 
        });

        async function processImage(imageSource) {
            lastScannedNumber.innerText = "Memproses...";
            lastScannedBadge.innerHTML = `<span class="text-[10px] bg-cyan-500/20 text-cyan-300 px-3 py-1 rounded-xl font-semibold uppercase animate-pulse">Membaca OCR...</span>`;
            
            try {
                const result = await Tesseract.recognize(imageSource, 'eng');
                const text = result.data.text.replace(/\s+/g, ''); 
                const matches = text.match(orderRegex);
                
                if (matches && matches.length > 0) {
                    let num = matches[0]; 
                    
                    let isInDb = false;
                    let meta = { toko: "-", kurir: "-", produk: "-" };

                    if (masterDatabase.size > 0 && masterDatabase.has(num)) {
                        isInDb = true;
                        meta = masterDatabase.get(num);
                    } else if (masterDatabase.size === 0) {
                        isInDb = true; 
                    }

                    let isAlreadyScanned = scannedNumbers.has(num);

                    if (isAlreadyScanned) {
                        playSound('warn');
                        lastScannedNumber.innerText = num;
                        lastScannedBadge.innerHTML = `<span class="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-3 py-1 rounded-bold uppercase">Di-scan Ulang</span>`;
                        showToast(`Resi ${num} di-scan ulang`, "warn");
                    } else {
                        scannedNumbers.add(num);
                        if (isInDb) {
                            validCount++;
                            countValidSpan.innerText = validCount;
                        }

                        scanHistoryData.unshift({
                            resi: num,
                            invoice: num,
                            toko: meta.toko,
                            kurir: meta.kurir,
                            produk: meta.produk,
                            status: isInDb ? 'VALID' : 'TIDAK VALID',
                            waktu: new Date().toLocaleTimeString()
                        });

                        saveToLocalStorage();
                        renderHistoryList();
                        updateRemainingDisplay(); 
                    }

                    lastScannedNumber.innerText = num;
                    
                    if(APPS_SCRIPT_URL && isInDb) {
                        fetch(`${APPS_SCRIPT_URL}?resi=${num}&status=Berhasil%20Scan`, {
                            method: 'GET',
                            redirect: 'follow'
                        }).catch(err => console.log("Sync Error:", err));
                    }

                    if(isInDb) {
                        playSound('success');
                        lastScannedBadge.innerHTML = `<span class="text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-3 py-1 rounded-bold uppercase">Ada (${meta.toko})</span>`;
                    } else {
                        playSound('error');
                        lastScannedBadge.innerHTML = `<span class="text-[10px] bg-rose-500/20 text-rose-300 px-3 py-1 rounded-bold uppercase">Tidak Ada</span>`;
                    }
                } else {
                    playSound('error');
                    lastScannedNumber.innerText = "Tidak Dikenali";
                    lastScannedBadge.innerHTML = `<span class="text-[10px] bg-rose-500/20 text-rose-300 px-3 py-1 rounded-bold uppercase">Gagal Deteksi</span>`;
                }
            } catch (error) {
                lastScannedNumber.innerText = "Error Sistem";
                console.error(error);
            }
        }

        btnScan.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg');
            processImage(imageData);
        });

        fileUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => processImage(event.target.result);
                reader.readAsDataURL(file);
            }
        });

        function updateRemainingDisplay() {
            if(masterDatabase.size === 0) return;

            let remainingListArray = [];
            masterDatabase.forEach((meta, resi) => {
                if(!scannedNumbers.has(resi)) {
                    remainingListArray.push({ resi, ...meta });
                }
            });

            countRemainingSpan.innerText = remainingListArray.length;
            remainingList.innerHTML = '';

            if(remainingListArray.length === 0) {
                remainingList.innerHTML = `<li class="text-center text-emerald-400 text-xs py-5 font-bold">Semua resi di database sudah selesai discan</li>`;
                return;
            }

            remainingListArray.forEach(item => {
                const li = document.createElement('li');
                li.className = "font-mono text-amber-100 bg-amber-950/30 p-3 rounded-2xl border border-amber-500/20 text-xs shadow-sm space-y-1.5 backdrop-blur-md";
                li.innerHTML = `
                    <div class="flex justify-between items-center"><span class="tracking-wide font-bold text-amber-300">${item.resi}</span><span class="text-[9px] bg-amber-500/20 px-2 py-0.5 rounded-full font-sans font-bold text-amber-200 border border-amber-500/30 uppercase">Belum</span></div>
                    <div class="text-[10px] text-amber-200/70 font-sans grid grid-cols-2 gap-1 pt-1.5 border-t border-amber-500/20">
                        <div>Toko: <b class="text-white">${item.toko}</b></div>
                        <div>Kurir: <b class="text-white">${item.kurir}</b></div>
                        <div class="col-span-2">Produk: <b class="text-white">${item.produk}</b></div>
                    </div>`;
                remainingList.appendChild(li);
            });
        }

        btnToggleRemaining.addEventListener('click', () => {
            if(masterDatabase.size === 0) {
                showToast("Database belum termuat", "error");
                return;
            }
            if(remainingContainer.classList.contains('hidden')) {
                remainingContainer.classList.remove('hidden');
                toggleText.innerText = "Sembunyikan Sisa";
            } else {
                remainingContainer.classList.add('hidden');
                toggleText.innerText = "Cek Sisa Belum Discan";
            }
        });

        btnClearHistory.addEventListener('click', () => {
            if(scannedNumbers.size === 0) {
                showToast("Riwayat sudah kosong", "info");
                return;
            }
            if(confirm("Yakin ingin menghapus seluruh riwayat dan cache sesi ini?")) {
                scannedNumbers.clear();
                scanHistoryData = [];
                validCount = 0;
                localStorage.clear();
                countValidSpan.innerText = "0";
                renderHistoryList();
                updateRemainingDisplay();
                showToast("Riwayat sesi dibersihkan", "success");
            }
        });

        btnCopyValid.addEventListener('click', () => {
            const validItems = scanHistoryData.filter(item => item.status === 'VALID');
            if(validItems.length === 0) {
                showToast("Tidak ada resi valid untuk disalin", "error");
                return;
            }
            const validNumbers = validItems.map(item => item.resi);
            navigator.clipboard.writeText(validNumbers.join('\n')).then(() => {
                showToast(`Berhasil menyalin ${validNumbers.length} resi valid`, "success");
            });
        });

        btnCopyInvalid.addEventListener('click', () => {
            const invalidItems = scanHistoryData.filter(item => item.status === 'TIDAK VALID');
            if(invalidItems.length === 0) {
                showToast("Tidak ada resi tidak valid untuk disalin", "error");
                return;
            }
            const invalidNumbers = invalidItems.map(item => item.resi);
            navigator.clipboard.writeText(invalidNumbers.join('\n')).then(() => {
                showToast(`Berhasil menyalin ${invalidNumbers.length} resi tidak valid`, "success");
            });
        });

        btnCopyRemaining.addEventListener('click', () => {
            let remainingNumbers = [];
            masterDatabase.forEach((meta, resi) => {
                if(!scannedNumbers.has(resi)) {
                    remainingNumbers.push(resi);
                }
            });

            if(remainingNumbers.length === 0) {
                showToast("Tidak ada sisa resi yang belum discan", "info");
                return;
            }

            navigator.clipboard.writeText(remainingNumbers.join('\n')).then(() => {
                showToast(`Berhasil menyalin ${remainingNumbers.length} sisa resi`, "success");
            });
        });

        btnExportXlsx.addEventListener('click', () => {
            if(scanHistoryData.length === 0) {
                showToast("Belum ada data resi untuk diexport", "error");
                return;
            }

            const exportRows = scanHistoryData.map((item, idx) => ({
                "No": idx + 1,
                "Nomor Resi / Invoice": item.resi,
                "Nama Toko": item.toko,
                "Kurir Pickup": item.kurir,
                "Nama Produk": item.produk,
                "Status Scan": item.status,
                "Waktu Scan": item.waktu,
                "User ID": currentUser || "-"
            }));

            const worksheet = XLSX.utils.json_to_sheet(exportRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Laporan Scan Resi v3.1");

            const dateStr = new Date().toISOString().slice(0,10);
            XLSX.writeFile(workbook, `Laporan_Resi_v3.1_${dateStr}.xlsx`);
            showToast("File XLSX berhasil diunduh", "success");
        });
    </script>
</body>
</html>
