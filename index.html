<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Resi Pro - Offline First</title>
    <!-- Tailwind CSS untuk Desain Modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS untuk Ekspor Excel (.xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0B0F19; color: #F8FAFC; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <span class="text-xs bg-cyan-500/10 text-cyan-400 font-semibold px-2 py-0.5 rounded-full border border-cyan-500/20">v3.4 Lokal</span>
                <h1 class="text-lg font-bold text-white mt-0.5">Database Resi</h1>
            </div>
            <div id="sync-status" class="flex items-center gap-1.5 text-xs text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="sync-text">Siap Digunakan</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Statistik Cards -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-900/90 border border-slate-800 p-4 rounded-2xl shadow-lg">
                <p class="text-xs text-slate-400 font-medium">SUDAH DISCAN</p>
                <h2 id="count-scanned" class="text-3xl font-extrabold text-emerald-400 mt-1">0</h2>
            </div>
            <div class="bg-slate-900/90 border border-slate-800 p-4 rounded-2xl shadow-lg">
                <p class="text-xs text-slate-400 font-medium">BELUM DISCAN</p>
                <h2 id="count-unscanned" class="text-3xl font-extrabold text-amber-400 mt-1">0</h2>
            </div>
        </div>

        <!-- Input / Scanner Section -->
        <div class="bg-slate-900/90 border border-slate-800 p-4 rounded-2xl shadow-lg space-y-3">
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Input / Scan Nomor Resi</label>
            <div class="flex gap-2">
                <input type="text" id="resi-input" autofocus placeholder="Scan atau ketik nomor resi..." 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-cyan-500 transition">
                <button onclick="processScan()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-semibold px-5 py-3 rounded-xl text-sm transition shadow-lg shadow-cyan-600/20">
                    Proses
                </button>
            </div>
        </div>

        <!-- Tombol Aksi & Export -->
        <div class="grid grid-cols-2 gap-3">
            <button onclick="exportToExcel()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-medium py-2.5 px-4 rounded-xl text-xs transition flex items-center justify-center gap-2">
                📥 Export ke XLSX
            </button>
            <button onclick="resetSession()" class="bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 text-rose-400 font-medium py-2.5 px-4 rounded-xl text-xs transition">
                🗑️ Hapus Sesi Scan
            </button>
        </div>

        <!-- Riwayat / Daftar Terakhir -->
        <div class="space-y-2">
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-1">Riwayat Scan Terbaru</h3>
            <div id="scan-history" class="space-y-2">
                <!-- Log item akan muncul di sini secara dinamis -->
                <div class="text-center py-6 text-slate-500 text-xs">Belum ada resi yang dipindai pada sesi ini.</div>
            </div>
        </div>

    </main>

    <!-- Script Logika Client-Side -->
    <script>
        // Masukkan URL Publik CSV Google Sheets Anda di sini
        // Cara ambil: File > Share > Publish to web > Format: Comma-separated values (.csv)
        const CSV_URL = "GANTI_DENGAN_LINK_CSV_GOOGLE_SHEETS_ANDA";

        let masterData = []; // Menyimpan data dari Sheets
        let scannedData = JSON.parse(localStorage.getItem('scanned_resis') || '{}');

        async function loadMasterData() {
            try {
                document.getElementById('sync-text').innerText = "Memuat Data...";
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                
                // Parse CSV sederhana
                const rows = csvText.split('\n').map(row => row.split(','));
                masterData = [];
                
                // Asumsi: Kolom A = Resi, Kolom B = Toko, Kolom C = Kurir, Kolom D = Produk
                for (let i = 1; i < rows.length; i++) {
                    const cols = rows[i];
                    if (cols && cols[0]) {
                        masterData.push({
                            resi: cols[0].replace(/["r]/g, "").trim(),
                            toko: cols[1] ? cols[1].replace(/["r]/g, "").trim() : "-",
                            kurir: cols[2] ? cols[2].replace(/["r]/g, "").trim() : "-",
                            produk: cols[3] ? cols[3].replace(/["r]/g, "").trim() : "-"
                        });
                    }
                }

                document.getElementById('sync-text').innerText = `Terhubung (${masterData.length} Resi)`;
                updateCounters();
            } catch (error) {
                console.error("Gagal memuat CSV:", error);
                document.getElementById('sync-text').innerText = "Mode Offline (Cache)";
                document.getElementById('sync-status').className = "flex items-center gap-1.5 text-xs text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-full border border-amber-500/20";
                // Tetap hitung counter dari data lokal jika ada
                updateCounters();
            }
        }

        document.getElementById('resi-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                processScan();
            }
        });

        function processScan() {
            const inputEl = document.getElementById('resi-input');
            const resiVal = inputEl.value.trim();
            if (!resiVal) return;

            const timeString = new Date().toLocaleTimeString('id-ID');
            
            // Cek apakah resi ada di master data
            const found = masterData.find(item => item.resi === resiVal);

            if (found) {
                scannedData[resiVal] = {
                    status: "Berhasil Scan",
                    time: timeString,
                    toko: found.toko,
                    kurir: found.kurir,
                    produk: found.produk
                };
            } else {
                // Tetap catat meskipun tidak ada di sheet (sebagai invalid/manual)
                scannedData[resiVal] = {
                    status: "Tidak Ada di Master",
                    time: timeString,
                    toko: "-",
                    kurir: "-",
                    produk: "-"
                };
            }

            localStorage.setItem('scanned_resis', JSON.stringify(scannedData));
            inputEl.value = "";
            updateCounters();
            renderHistory(resiVal);
        }

        function updateCounters() {
            const totalMaster = masterData.length;
            const scannedCount = Object.keys(scannedData).length;
            
            document.getElementById('count-scanned').innerText = scannedCount;
            document.getElementById('count-unscanned').innerText = Math.max(0, totalMaster - scannedCount);
        }

        function renderHistory(latestResi) {
            const historyContainer = document.getElementById('scan-history');
            historyContainer.innerHTML = "";

            const entries = Object.entries(scannedData).reverse().slice(0, 10); // Ambil 10 terakhir
            
            if (entries.length === 0) {
                historyContainer.innerHTML = `<div class="text-center py-6 text-slate-500 text-xs">Belum ada resi yang dipindai pada sesi ini.</div>`;
                return;
            }

            entries.forEach(([resi, data]) => {
                const isValid = data.status === "Berhasil Scan";
                const card = document.createElement('div');
                card.className = `p-3 rounded-xl border ${isValid ? 'bg-emerald-950/20 border-emerald-500/30' : 'bg-rose-950/20 border-rose-500/30'} flex flex-col gap-1`;
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-white text-sm">${resi}</span>
                        <span class="text-[10px] px-2 py-0.5 rounded font-semibold ${isValid ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">${data.status} (${data.time})</span>
                    </div>
                    <div class="text-xs text-slate-400">Toko: ${data.toko} | Kurir: ${data.kurir}</div>
                    <div class="text-xs text-slate-300 font-medium">Produk: ${data.produk}</div>
                `;
                historyContainer.appendChild(card);
            });
        }

        function exportToExcel() {
            if (masterData.length === 0) {
                alert("Data master belum termuat. Pastikan URL CSV Google Sheets sudah benar.");
                return;
            }

            // Gabungkan master data dengan status scan lokal
            const exportRows = masterData.map((item, index) => {
                const scanInfo = scannedData[item.resi];
                return {
                    "No": index + 1,
                    "Nomor Resi / Invoice": item.resi,
                    "Nama Toko": item.toko,
                    "Kurir": item.kurir,
                    "Produk": item.produk,
                    "Status Scan": scanInfo ? "Berhasil Scan" : "Belum Discan",
                    "Waktu Scan": scanInfo ? scanInfo.time : "-"
                };
            });

            const worksheet = XLSX.utils.json_to_sheet(exportRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Rekapitulasi Resi");

            // Download file .xlsx
            XLSX.writeFile(workbook, "Laporan_Status_Resi_Shopee.xlsx");
        }

        function resetSession() {
            if (confirm("Yakin ingin menghapus seluruh riwayat scan sesi ini?")) {
                localStorage.removeItem('scanned_resis');
                scannedData = {};
                updateCounters();
                renderHistory();
            }
        }

        // Jalankan saat pertama kali dibuka
        window.onload = () => {
            loadMasterData();
            renderHistory();
        };
    </script>
</body>
</html>
