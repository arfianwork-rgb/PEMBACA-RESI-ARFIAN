<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Resi v3.1 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/tesseract.js@v4.1.1/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Plus Jakarta Sans', sans-serif; } 
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-animate {
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .glass-panel {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.8));
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between m-0 p-0 overflow-x-hidden pb-28">

    <!-- Header & Dashboard Utama -->
    <div id="main-dashboard" class="w-full max-w-md mx-auto p-4 space-y-4 flex-1 flex flex-col">
        <!-- Header Atas -->
        <div class="glass-panel px-4 py-3.5 rounded-3xl flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/30 text-white font-extrabold text-xs tracking-wider">
                    v3.1
                </div>
                <div>
                    <h1 class="text-sm font-extrabold text-white tracking-tight flex items-center gap-1.5">
                        Database Resi <span class="text-[9px] bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 px-2 py-0.5 rounded-full font-semibold uppercase tracking-wider">Pro</span>
                    </h1>
                    <p id="db-status" class="text-[11px] text-amber-400/90 font-medium mt-0.5">Menghubungkan Google Sheets...</p>
                </div>
            </div>
            <div class="flex items-center gap-1.5 bg-emerald-500/10 px-3 py-1.5 rounded-full border border-emerald-500/20">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span class="text-[10px] font-bold text-emerald-300">Live Cloud</span>
            </div>
        </div>

        <!-- Panel Total Statistik -->
        <div class="grid grid-cols-2 gap-3.5">
            <div class="glass-panel p-4 rounded-3xl border-emerald-500/20 text-center relative overflow-hidden group">
                <span class="block text-3xl font-black text-emerald-400 tracking-tight" id="count-valid">0</span>
                <span class="text-[10px] uppercase tracking-wider text-emerald-300/80 font-bold mt-1 block">Sudah Discan</span>
            </div>
            <div class="glass-panel p-4 rounded-3xl border-amber-500/20 text-center relative overflow-hidden group">
                <span class="block text-3xl font-black text-amber-400 tracking-tight" id="count-remaining">0</span>
                <span class="text-[10px] uppercase tracking-wider text-amber-300/80 font-bold mt-1 block">Belum Discan</span>
            </div>
        </div>

        <!-- KONTAINER UTAMA: RIWAYAT SUDAH DISCAN -->
        <div class="glass-panel p-4 rounded-3xl flex flex-col space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="text-xs font-extrabold text-cyan-400 uppercase tracking-wider">
                    Riwayat Sudah Discan
                </h3>
                <div class="flex items-center gap-2">
                    <label class="text-[11px] text-blue-400 hover:text-blue-300 font-bold underline cursor-pointer bg-blue-500/10 px-3 py-1 rounded-xl border border-blue-500/20 transition active:scale-95">
                        Galeri
                        <input type="file" id="file-upload" accept="image/*" class="hidden">
                    </label>
                    <button id="btn-clear-history" class="text-[11px] text-rose-400 hover:text-rose-300 font-bold underline bg-rose-500/10 px-3 py-1 rounded-xl border border-rose-500/20 transition active:scale-95">Hapus Sesi</button>
                </div>
            </div>

            <!-- Kotak Pencarian -->
            <div class="relative">
                <input type="text" id="search-history" placeholder="Cari nomor resi, toko, atau produk..." class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl px-4 py-2.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500/60 shadow-inner transition">
            </div>

            <!-- Tombol Aksi Riwayat -->
            <div class="grid grid-cols-3 gap-2">
                <button id="btn-copy-valid" class="bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/30 text-emerald-300 text-[11px] font-bold py-2 px-1 rounded-2xl transition active:scale-95 shadow-sm">
                    Salin Valid
                </button>
                <button id="btn-export-xlsx" class="bg-cyan-500/15 hover:bg-cyan-500/25 border border-cyan-500/30 text-cyan-300 text-[11px] font-bold py-2 px-1 rounded-2xl transition active:scale-95 shadow-sm">
                    Export XLSX
                </button>
                <button id="btn-copy-invalid" class="bg-rose-500/15 hover:bg-rose-500/25 border border-rose-500/30 text-rose-300 text-[11px] font-bold py-2 px-1 rounded-2xl transition active:scale-95 shadow-sm">
                    Invalid
                </button>
            </div>

            <!-- List Sudah Discan -->
            <ul id="result-list" class="space-y-2 bg-slate-900/60 p-3 rounded-2xl max-h-48 overflow-y-auto border border-slate-800/80">
                <li class="text-center text-slate-500 text-xs py-5">Belum ada resi yang dipindai hari ini</li>
            </ul>
        </div>

        <!-- PANEL SISA BELUM DISCAN -->
        <div class="glass-panel p-4 rounded-3xl flex flex-col space-y-3">
            <div class="grid grid-cols-2 gap-2">
                <button id="btn-toggle-remaining" class="bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/30 text-amber-300 text-[11px] font-extrabold py-2.5 px-2 rounded-2xl transition active:scale-95 shadow-sm">
                    <span id="toggle-text">Cek Sisa Belum Discan</span>
                </button>
                <button id="btn-copy-remaining" class="bg-slate-800/80 hover:bg-slate-700 border border-slate-700/80 text-slate-300 text-[11px] font-extrabold py-2.5 px-2 rounded-2xl transition active:scale-95 shadow-sm">
                    Salin Semua Sisa
                </button>
            </div>

            <!-- Kontainer Daftar Sisa Tersembunyi -->
            <div id="remaining-container" class="hidden space-y-2 pt-2 border-t border-slate-800">
                <ul id="remaining-list" class="space-y-2 bg-slate-900/60 p-3 rounded-2xl max-h-40 overflow-y-auto border border-slate-800/80">
                    <li class="text-center text-slate-500 text-xs py-4">Memuat data...</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Halaman Login USER (Tersembunyi secara Default) -->
    <div id="login-wrapper" class="hidden fixed inset-0 z-50 bg-slate-950 flex flex-col justify-center items-center p-4">
        <div class="glass-panel w-full max-w-sm p-6 rounded-3xl space-y-5 shadow-2xl border border-slate-800">
            <div class="text-center space-y-1">
                <h2 class="text-lg font-extrabold text-white tracking-tight">LOGIN USER</h2>
                <p class="text-xs text-slate-400">Masukkan User ID dan Password untuk melanjutkan</p>
            </div>

            <div class="space-y-3">
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">User ID</label>
                    <input type="text" id="login-userid" placeholder="Masukkan ID User..." class="w-full bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-cyan-500 shadow-inner">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Password</label>
                    <input type="password" id="login-pass" placeholder="Masukkan Password..." class="w-full bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-cyan-500 shadow-inner">
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button id="btn-submit-login" class="flex-1 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-extrabold py-3.5 px-4 rounded-2xl shadow-lg shadow-cyan-500/30 transition text-xs uppercase tracking-wider">
                    Masuk
                </button>
                <button id="btn-close-login" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3.5 px-5 rounded-2xl text-xs transition border border-slate-700">
                    Batal
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar Mengambang -->
    <nav class="fixed bottom-4 left-4 right-4 z-40 bg-slate-900/90 backdrop-blur-2xl border border-slate-800/80 px-6 py-3 rounded-3xl flex justify-around items-center shadow-2xl max-w-md mx-auto">
        <button onclick="autoSyncDatabase()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition active:scale-90">
            <span class="text-xs font-bold bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700/60 shadow-inner">SYNC</span>
            <span class="text-[9px] font-bold tracking-wider uppercase">Muat Ulang</span>
        </button>

        <button id="btn-start-camera" class="flex flex-col items-center gap-1 text-cyan-400 hover:text-cyan-300 transition active:scale-90 -mt-6">
            <span class="text-xs font-extrabold bg-gradient-to-tr from-cyan-500 to-blue-600 text-white px-5 py-3 rounded-2xl shadow-xl shadow-cyan-500/40 border border-cyan-300/30 uppercase tracking-widest">PINDAI</span>
        </button>

        <button id="btn-open-login" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-300 transition active:scale-90">
            <span id="nav-user-label" class="text-xs font-bold bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700/60 shadow-inner">USER</span>
            <span class="text-[9px] font-bold tracking-wider uppercase">Akun</span>
        </button>
    </nav>

    <!-- Area Utama Kamera Full Screen -->
    <main id="camera-wrapper" class="hidden fixed inset-0 z-50 bg-black flex flex-col justify-between">
        <div class="relative w-full flex-1 bg-black overflow-hidden">
            <video id="video" class="w-full h-full object-cover" autoplay playsinline></video>
            <div class="absolute inset-0 border-2 border-cyan-400/80 border-dashed opacity-75 m-12 rounded-3xl pointer-events-none animate-pulse"></div>
        </div>
        <canvas id="canvas" class="hidden"></canvas>

        <footer class="w-full bg-slate-900/95 backdrop-blur-2xl p-4 border-t border-slate-800 space-y-3 rounded-t-3xl shadow-2xl">
            <div class="bg-slate-950/80 border border-slate-800/80 p-3.5 rounded-2xl flex items-center justify-between">
                <div class="overflow-hidden pr-2">
                    <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider block">Resi Terakhir:</span>
                    <span id="last-scanned-number" class="text-sm font-mono font-bold text-cyan-300 tracking-wide">-</span>
                </div>
                <div id="last-scanned-badge">
                    <span class="text-[10px] bg-slate-800 text-slate-400 px-3 py-1.5 rounded-xl font-medium">Belum ada scan</span>
                </div>
            </div>

            <div class="flex gap-2.5">
                <button id="btn-scan" class="flex-1 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-extrabold py-3.5 px-4 rounded-2xl shadow-lg shadow-cyan-500/30 active:scale-95 transition text-sm flex items-center justify-center uppercase tracking-wider">
                    Ambil / Scan Resi
                </button>
                <button id="btn-stop-camera" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3.5 px-5 rounded-2xl text-xs transition active:scale-95 border border-slate-700">
                    Tutup
                </button>
            </div>
        </footer>
    </main>

    <div id="toast-container" class="fixed bottom-24 left-0 right-0 z-50 flex justify-center px-4 pointer-events-none"></div>

    <script>
        const FIXED_SHEETS_URL = "htthttps://docs.google.com/spreadsheets/d/e/2PACX-1vTrePM4XsuFuQXkiAxKVT6pEaAWFfIFcrrplLmkm0JuH4zJTJnY2hMSQ3uBRMEaQdRm-QBeCdPGeTjv/pub?output=csv";
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwmpw1m-seyf7ti699vmtQp32qSP8P1Ql2Ce8jtCdp5OWlUWWoUhvpd4WzjboBFHZtv/exec"; 

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const resultList = document.getElementById('result-list');
        const remainingList = document.getElementById('remaining-list');
        const remainingContainer = document.getElementById('remaining-container');
        const toggleText = document.getElementById('toggle-text');
        const searchHistory = document.getElementById('search-history');
        const toastContainer = document.getElementById('toast-container');
        
        const mainDashboard = document.getElementById('main-dashboard');
        const cameraWrapper = document.getElementById('camera-wrapper');
        const bottomNav = document.querySelector('nav');
        
        const btnStart = document.getElementById('btn-start-camera');
        const btnScan = document.getElementById('btn-scan');
        const btnStop = document.getElementById('btn-stop-camera');
        const fileUpload = document.getElementById('file-upload');
        
        const btnCopyValid = document.getElementById('btn-copy-valid');
        const btnCopyInvalid = document.getElementById('btn-copy-invalid');
        const btnCopyRemaining = document.getElementById('btn-copy-remaining');
        const btnToggleRemaining = document.getElementById('btn-toggle-remaining');
        const btnExportXlsx = document.getElementById('btn-export-xlsx');
        const btnClearHistory = document.getElementById('btn-clear-history');
        
        const loginWrapper = document.getElementById('login-wrapper');
        const btnOpenLogin = document.getElementById('btn-open-login');
        const btnCloseLogin = document.getElementById('btn-close-login');
        const btnSubmitLogin = document.getElementById('btn-submit-login');
        const loginUseridInput = document.getElementById('login-userid');
        const loginPassInput = document.getElementById('login-pass');
        const navUserLabel = document.getElementById('nav-user-label');

        const dbStatus = document.getElementById('db-status');
        const lastScannedNumber = document.getElementById('last-scanned-number');
        const lastScannedBadge = document.getElementById('last-scanned-badge');

        let stream = null;
        let scannedNumbers = new Set(JSON.parse(localStorage.getItem('v3_scannedNumbers') || '[]'));
        let scanHistoryData = JSON.parse(localStorage.getItem('v3_scanHistoryData') || '[]'); 
        let validCount = parseInt(localStorage.getItem('v3_validCount') || '0');
        let currentUser = localStorage.getItem('v3_currentUser') || '';
        let masterDatabase = new Map(); 
        const orderRegex = /58[67]\d{15}/g; 

        if(currentUser) {
            navUserLabel.innerText = currentUser.length > 5 ? currentUser.substring(0, 5) + '..' : currentUser;
        }

        btnOpenLogin.addEventListener('click', () => {
            loginWrapper.classList.remove('hidden');
            mainDashboard.classList.add('hidden');
            bottomNav.classList.add('hidden');
        });

        btnCloseLogin.
