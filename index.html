<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Resi Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/tesseract.js@v4.1.1/dist/tesseract.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Plus Jakarta Sans', sans-serif; } 
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between m-0 p-0 overflow-x-hidden">

    <!-- Header Ringkas (Hanya muncul jika kamera tertutup agar bersih) -->
    <header id="app-header" class="w-full bg-slate-900/90 backdrop-blur-md p-4 border-b border-slate-800 flex justify-between items-center z-20">
        <div>
            <h1 class="text-base font-bold text-white tracking-tight">Database Resi Web</h1>
            <p id="db-status" class="text-[10px] text-amber-400">Menghubungkan Google Sheets...</p>
        </div>
        <div class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl text-center">
            <span class="block text-sm font-extrabold text-emerald-400" id="count">0</span>
            <span class="text-[9px] uppercase tracking-wider text-slate-400 font-semibold">Total</span>
        </div>
    </header>

    <!-- Area Utama Kamera Full Screen -->
    <main class="flex-1 relative w-full flex flex-col items-center justify-center bg-black">
        
        <!-- Placeholder / Tombol Buka Kamera Awal -->
        <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center z-10 bg-slate-950">
            <div class="w-16 h-16 bg-blue-600/25 border border-blue-500/50 rounded-full flex items-center justify-center mb-4 text-blue-400 text-2xl">
                📸
            </div>
            <h2 class="text-lg font-bold text-white mb-1">Siap Memindai Resi</h2>
            <p class="text-xs text-slate-400 max-w-xs mb-6">Arahkan kamera ke nomor resi pengiriman untuk validasi otomatis dengan database.</p>
            <button id="btn-start-camera" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 px-8 rounded-2xl shadow-lg shadow-blue-600/30 active:scale-95 transition text-sm">
                Buka Kamera Full Screen
            </button>
            
            <!-- Fallback Upload File -->
            <div class="mt-6">
                <label class="text-xs text-slate-400 cursor-pointer hover:text-slate-200 underline">
                    Atau unggah foto dari galeri
                    <input type="file" id="file-upload" accept="image/*" class="hidden">
                </label>
            </div>
        </div>

        <!-- Video Kamera Full Screen -->
        <div id="camera-container" class="hidden absolute inset-0 w-full h-full bg-black">
            <video id="video" class="w-full h-full object-cover" autoplay playsinline></video>
            <!-- Target Garis Pemindai -->
            <div class="absolute inset-0 border-2 border-emerald-400 border-dashed opacity-60 m-10 rounded-3xl pointer-events-none animate-pulse"></div>
        </div>

        <canvas id="canvas" class="hidden"></canvas>
    </main>

    <!-- Panel Informasi Bagian Bawah (Muncul Saat Kamera Aktif/Scan) -->
    <footer id="scanner-footer" class="hidden w-full bg-slate-900/95 backdrop-blur-md p-4 border-t border-slate-800 z-20 space-y-3">
        <!-- Status & Hasil Terakhir -->
        <div class="bg-slate-950/80 border border-slate-800 p-3 rounded-2xl flex items-center justify-between">
            <div class="overflow-hidden pr-2">
                <span class="text-[10px] uppercase font-semibold text-slate-400 block">Resi Terakhir:</span>
                <span id="last-scanned-number" class="text-sm font-mono font-bold text-slate-200 tracking-wide">-</span>
            </div>
            <div id="last-scanned-badge">
                <span class="text-[10px] bg-slate-800 text-slate-400 px-3 py-1 rounded-xl font-medium">Belum ada scan</span>
            </div>
        </div>

        <!-- Tombol Aksi Bawah -->
        <div class="flex gap-2">
            <button id="btn-scan" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-2xl shadow-lg shadow-emerald-600/25 active:scale-95 transition text-sm flex items-center justify-center gap-2">
                <span>🔍</span> AMBIL / SCAN RESI
            </button>
            <button id="btn-stop-camera" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-3 px-4 rounded-2xl text-xs transition">
                Tutup
            </button>
        </div>

        <!-- Daftar Riwayat Singkat & Tombol Salin -->
        <div class="flex justify-between items-center pt-1">
            <span class="text-xs text-slate-400" id="scan-info-text">Riwayat tersimpan di sesi ini</span>
            <button id="btn-copy" class="text-xs text-blue-400 hover:text-blue-300 font-semibold underline">
                Salin Semua Resi
            </button>
        </div>
    </footer>

    <!-- Hidden list untuk menampung data di balik layar -->
    <ul id="result-list" class="hidden"></ul>

    <script>
        const FIXED_SHEETS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSEDsXuDSQyUoOSHH9_S_em73jCM2iYIlbBo9_A_B8EzHoLye9_TuYJqld9pcehq6iWb8qHQrRVjj4o/pub?output=csv";

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const resultList = document.getElementById('result-list');
        const countSpan = document.getElementById('count');
        
        const appHeader = document.getElementById('app-header');
        const startScreen = document.getElementById('start-screen');
        const containerKamera = document.getElementById('camera-container');
        const scannerFooter = document.getElementById('scanner-footer');
        
        const btnStart = document.getElementById('btn-start-camera');
        const btnScan = document.getElementById('btn-scan');
        const btnStop = document.getElementById('btn-stop-camera');
        const fileUpload = document.getElementById('file-upload');
        const btnCopy = document.getElementById('btn-copy');
        
        const dbStatus = document.getElementById('db-status');
        const lastScannedNumber = document.getElementById('last-scanned-number');
        const lastScannedBadge = document.getElementById('last-scanned-badge');

        let stream = null;
        let scannedNumbers = new Set();
        let masterDatabase = new Set();
        const orderRegex = /58[67]\d{15}/g; 

        // Sinkronisasi otomatis Google Sheets CSV
        async function autoSyncDatabase() {
            try {
                const response = await fetch(FIXED_SHEETS_URL);
                const csvText = await response.text();
                
                masterDatabase.clear();
                const lines = csvText.split(/\r?\n/);

                lines.forEach(line => {
                    const cols = line.split(',');
                    cols.forEach(col => {
                        const cleanVal = col.replace(/["']/g, "").trim();
                        const matches = cleanVal.match(orderRegex);
                        if (matches) {
                            matches.forEach(m => masterDatabase.add(m));
                        } else if (cleanVal.length >= 10) {
                            masterDatabase.add(cleanVal);
                        }
                    });
                });

                if(masterDatabase.size > 0) {
                    dbStatus.innerText = `Terhubung (${masterDatabase.size} resi aktif)`;
                    dbStatus.className = "text-[10px] text-emerald-400";
                } else {
                    dbStatus.innerText = "Database kosong";
                    dbStatus.className = "text-[10px] text-amber-400";
                }
            } catch (err) {
                dbStatus.innerText = "Gagal memuat database online";
                dbStatus.className = "text-[10px] text-rose-400";
            }
        }

        window.addEventListener('DOMContentLoaded', autoSyncDatabase);

        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            if(type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, ctx.currentTime);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, ctx.currentTime);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.5);
            }
        }

        // Buka Kamera Full Screen
        btnStart.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
                
                startScreen.classList.add('hidden');
                containerKamera.classList.remove('hidden');
                scannerFooter.classList.remove('hidden');
                appHeader.classList.add('hidden'); // Sembunyikan header atas agar kamera benar-benar maksimal di layar
            } catch (err) {
                alert("Gagal membuka kamera: " + err.message);
            }
        });

        // Tutup Kamera
        btnStop.addEventListener('click', () => {
            if (stream) stream.getTracks().forEach(track => track.stop());
            containerKamera.classList.add('hidden');
            scannerFooter.classList.add('hidden');
            startScreen.classList.remove('hidden');
            appHeader.classList.remove('hidden');
        });

        async function processImage(imageSource) {
            lastScannedNumber.innerText = "Memproses...";
            lastScannedBadge.innerHTML = `<span class="text-[10px] bg-amber-500/20 text-amber-400 px-3 py-1 rounded-xl font-medium animate-pulse">⏳ Membaca OCR...</span>`;
            
            try {
                const result = await Tesseract.recognize(imageSource, 'eng');
                const text = result.data.text.replace(/\s+/g, ''); 
                const matches = text.match(orderRegex);
                
                if (matches && matches.length > 0) {
                    let num = matches[0]; // Ambil nomor pertama yang terdeteksi
                    
                    let isInDb = true;
                    if (masterDatabase.size > 0) {
                        isInDb = masterDatabase.has(num);
                    }

                    if (!scannedNumbers.has(num)) {
                        scannedNumbers.add(num);
                        tambahKeDaftar(num, isInDb);
                    }

                    lastScannedNumber.innerText = num;
                    
                    if(isInDb) {
                        playSound('success');
                        lastScannedBadge.innerHTML = `<span class="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-xl font-bold">✔ SUDAH DI SKEN / ADA</span>`;
                    } else {
                        playSound('error');
                        lastScannedBadge.innerHTML = `<span class="text-[10px] bg-rose-500/20 text-rose-400 border border-rose-500/30 px-3 py-1 rounded-xl font-bold">✖ TIDAK ADA DI DATA</span>`;
                    }
                } else {
                    playSound('error');
                    lastScannedNumber.innerText = "Tidak Dikenali";
                    lastScannedBadge.innerHTML = `<span class="text-[10px] bg-rose-500/20 text-rose-400 px-3 py-1 rounded-xl font-bold">❌ Gagal Deteksi</span>`;
                }
            } catch (error) {
                lastScannedNumber.innerText = "Error Sistem";
                console.error(error);
            }
        }

        // Tombol Scan saat kamera aktif
        btnScan.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg');
            processImage(imageData);
        });

        // Upload dari galeri
        fileUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => processImage(event.target.result);
                reader.readAsDataURL(file);
            }
        });

        function tambahKeDaftar(nomor, isInDb) {
            const li = document.createElement('li');
            li.dataset.number = nomor;
            li.dataset.status = isInDb ? 'ada' : 'tidak';
            resultList.prepend(li);
            countSpan.innerText = scannedNumbers.size;
        }

        // Salin semua nomor resi yang berhasil dipindai
        btnCopy.addEventListener('click', () => {
            if(scannedNumbers.size === 0) {
                alert("Belum ada resi yang dipindai.");
                return;
            }
            const listData = Array.from(scannedNumbers).join('\n');
            navigator.clipboard.writeText(listData).then(() => {
                const textAsli = btnCopy.innerText;
                btnCopy.innerText = "Berhasil Disalin!";
                setTimeout(() => {
                    btnCopy.innerText = textAsli;
                }, 2000);
            });
        });
    </script>
</body>
</html>
